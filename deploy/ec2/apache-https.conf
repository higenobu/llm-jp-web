# Install only AFTER certificate issuance and review of existing VirtualHosts.
# mod_ssl provides Listen 443 on Amazon Linux. Do not add a duplicate Listen.
<VirtualHost *:443>
    ServerName llm-jp.com
    DocumentRoot "/var/www/llmjp-web"
    SSLEngine On
    SSLCertificateFile /etc/letsencrypt/live/llm-jp.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/llm-jp.com/privkey.pem
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    Include /etc/httpd/llmjp/apache-routes.inc
</VirtualHost>
