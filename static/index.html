<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LLM-JP Web Client</title>
  <style>
    body { font-family: sans-serif; max-width: 820px; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; }
    h1 { margin-bottom: .5rem; }
    .card { border: 1px solid #ddd; border-radius: 10px; padding: 1rem; margin-bottom: 1rem; }
    label { display: block; margin-top: .75rem; font-weight: 600; }
    input, textarea, button { width: 100%; box-sizing: border-box; font: inherit; }
    input, textarea { padding: .55rem; margin-top: .35rem; }
    button { margin-top: .9rem; padding: .65rem .8rem; cursor: pointer; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
    .muted { color: #666; font-size: .9rem; }
    .ok { color: #0a7f2e; }
    .err { color: #b00020; white-space: pre-wrap; }
    #result {
      border: 1px solid #ddd; border-radius: 8px; padding: .9rem 1.1rem;
      min-height: 140px; background: #fafafa; overflow-wrap: anywhere;
    }
    #result h1, #result h2, #result h3, #result h4 { margin: 1rem 0 .4rem; }
    #result p { margin: .5rem 0; }
    #result ul { margin: .4rem 0; padding-left: 1.4rem; }
    #result li { margin: .1rem 0; }
    #result code { background: #eee; padding: .1rem .3rem; border-radius: 4px; font-family: monospace; }
    #result pre { background: #111; color: #eee; padding: .8rem; border-radius: 8px; overflow: auto; white-space: pre-wrap; }
    #result pre code { background: none; padding: 0; }
    .meta { margin-top: .6rem; font-size: .85rem; color: #666; }
    details { border: 1px solid #ddd; border-radius: 8px; padding: .6rem .8rem; background: #fafafa; }
    summary { cursor:pointer; font-weight:600; }
    #thinkingText { margin-top:.6rem; white-space:pre-wrap; background:#111; color:#eee; padding:.8rem; border-radius:8px; }
  </style>
</head>
<body>
  <h1>LLM-JP Client</h1>
  <p><a href="/llmjp/personality">性格特性チェック（20問）</a> · <a href="/llmjp/personality/text">文章から傾向を振り返る</a> · <a href="/llmjp/classify">文書の機密判定</a></p>
  <p class="muted">Login → get JWT → call <code>POST /generate</code>.</p>

  <div class="card">
    <h3 style="margin-top:0">1) Login</h3>
    <div class="row">
      <div>
        <label for="username">Username</label>
        <input id="username" autocomplete="username" value="alice" />
      </div>
      <div>
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" />
      </div>
    </div>
    <button id="loginBtn" type="button">Login</button>
    <div id="loginMsg" class="muted"></div>

    <label for="token">JWT token</label>
    <textarea id="token" rows="3" placeholder="token appears here after login"></textarea>
    <div class="row">
      <button id="copyTokenBtn" type="button">Copy token</button>
      <button id="logoutBtn" type="button">Logout (clear token)</button>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-top:0">2) Generate</h3>
    <label for="prompt">Prompt</label>
    <textarea id="prompt" rows="6">ソフトウェア テスト 手法</textarea>

    <div class="row">
      <div>
        <label for="maxTokens">max_tokens</label>
        <input id="maxTokens" type="number" value="1024" min="1" />
      </div>
      <div>
        <label>&nbsp;</label>
        <button id="genBtn" type="button">Generate</button>
      </div>
    </div>

    <label style="display:flex;align-items:center;gap:.5rem;font-weight:400;margin-top:.8rem;">
      <input id="showThinking" type="checkbox" style="width:auto;" />
      Show model reasoning (thinking)
    </label>

    <div id="genMsg" class="muted"></div>

    <h3>Result</h3>
    <div id="result"><p class="muted">（生成結果がここに表示されます）</p></div>
    <div id="meta" class="meta"></div>

    <details id="thinkingBox" style="margin-top:.8rem;display:none;">
      <summary>Model reasoning (thinking)</summary>
      <pre id="thinkingText" style="margin-top:.6rem;"></pre>
    </details>

    <div class="row">
      <button id="dlJsonBtn" type="button" disabled>Download JSON</button>
      <button id="dlMdBtn" type="button" disabled>Download .md</button>
    </div>
    <button id="pdfBtn" type="button" disabled>結果を表示 / PDF保存</button>
    <p class="muted">結果専用の画面を開きます。「印刷 / PDF保存」から保存先を「PDFに保存」にしてください。入力プロンプトと最終回答を含みます。</p>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    const usernameEl = $("username");
    const passwordEl = $("password");
    const tokenEl = $("token");
    const promptEl = $("prompt");
    const maxTokensEl = $("maxTokens");
    const loginMsgEl = $("loginMsg");
    const genMsgEl = $("genMsg");
    const resultEl = $("result");
    const metaEl = $("meta");
    const showThinkingEl = $("showThinking");
    const thinkingBoxEl = $("thinkingBox");
    const thinkingTextEl = $("thinkingText");
    const dlJsonBtn = $("dlJsonBtn");
    const dlMdBtn = $("dlMdBtn");

    let lastPdf = null;
    let lastData = null;
    let lastMarkdown = "";
    let generationVersion = 0;

    tokenEl.value = localStorage.getItem("jwt_token") || "";
    showThinkingEl.checked = localStorage.getItem("show_thinking") === "1";

    function applyThinkingVisibility() {
      if (!showThinkingEl.checked) {
        thinkingBoxEl.style.display = "none";
        return;
      }
      const t = lastData && typeof lastData.thinking === "string" ? lastData.thinking.trim() : "";
      thinkingBoxEl.style.display = t ? "block" : "none";
      thinkingTextEl.textContent = t;
    }

    function esc(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    function inline(s) {
      let t = esc(s);
      t = t.replace(/`([^`]+)`/g, "<code>$1</code>");
      t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      return t;
    }
    function renderMarkdown(md) {
      const lines = md.replace(/\r\n/g, "\n").split("\n");
      const out = [];
      let inCode = false, inList = false;

      const closeList = () => {
        if (inList) { out.push("</ul>"); inList = false; }
      };

      for (const line of lines) {
        if (/^\s*```/.test(line)) {
          closeList();
          out.push(inCode ? "</code></pre>" : "<pre><code>");
          inCode = !inCode;
          continue;
        }
        if (inCode) { out.push(esc(line) + "\n"); continue; }

        const h = line.match(/^(#{1,4})\s+(.*)$/);
        if (h) {
          closeList();
          out.push("<h" + h[1].length + ">" + inline(h[2]) + "</h" + h[1].length + ">");
          continue;
        }

        const b = line.match(/^([\s\u3000]*)([-*\u30FB])\s*(.*)$/);
        if (b) {
          if (!inList) { out.push("<ul>"); inList = true; }
          const level = b[1].length > 0 ? 1 : 0;
          out.push('<li style="margin-left:' + (level * 1.4) + 'rem">' + inline(b[3]) + "</li>");
          continue;
        }

        if (line.trim() === "") { closeList(); continue; }

        closeList();
        out.push("<p>" + inline(line) + "</p>");
      }
      closeList();
      if (inCode) out.push("</code></pre>");
      return out.join("\n");
    }

    function stamp() {
      const d = new Date(), p = (n) => String(n).padStart(2, "0");
      return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + "-" + p(d.getHours()) + p(d.getMinutes());
    }

    function download(filename, text, mime) {
      const blob = new Blob([text], { type: mime + ";charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    async function login() {
      loginMsgEl.className = "muted";
      loginMsgEl.textContent = "Logging in...";
      try {
        const res = await fetch("/llmjp/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: usernameEl.value.trim(), password: passwordEl.value })
        });

        let data = {};
        try { data = await res.json(); } catch (_) {}
        if (!res.ok) throw new Error(data.detail || "Login failed (" + res.status + ")");
        if (!data.access_token) throw new Error("No access_token in response");

        tokenEl.value = data.access_token;
        localStorage.setItem("jwt_token", data.access_token);
        loginMsgEl.className = "ok";
        loginMsgEl.textContent = "Login success. Token saved in this browser.";
      } catch (e) {
        loginMsgEl.className = "err";
        loginMsgEl.textContent = e.message;
      }
    }

    function logout() {
      generationVersion += 1;
      promptEl.value = "";
      resultEl.replaceChildren();
      metaEl.textContent = "";
      genMsgEl.textContent = "";
      thinkingTextEl.textContent = "";
      thinkingBoxEl.style.display = "none";
      thinkingBoxEl.open = false;
      lastData = null;
      lastMarkdown = "";
      dlJsonBtn.disabled = true;
      dlMdBtn.disabled = true;
      $("pdfBtn").disabled = true;
      lastPdf = null;
      $("genBtn").disabled = false;
      tokenEl.value = "";
      localStorage.removeItem("jwt_token");
      loginMsgEl.className = "muted";
      loginMsgEl.textContent = "Logged out.";
    }

    async function generate() {
      const token = tokenEl.value.trim();
      if (!token) {
        genMsgEl.className = "err";
        genMsgEl.textContent = "Token is empty. Login first.";
        return;
      }

      genMsgEl.className = "muted";
      const requestVersion = ++generationVersion;
      genMsgEl.textContent = "Generating... (this can take a while)";
      $("genBtn").disabled = true;
      dlJsonBtn.disabled = true;
      dlMdBtn.disabled = true;
      $("pdfBtn").disabled = true;
      lastPdf = null;
      metaEl.textContent = "";
      thinkingTextEl.textContent = "";
      thinkingBoxEl.style.display = "none";

      const payload = {
        prompt: promptEl.value,
        max_tokens: Number(maxTokensEl.value || 1024)
      };

      try {
        const res = await fetch("/llmjp/generate", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
          },
          body: JSON.stringify(payload)
        });

        let data = {};
        try { data = await res.json(); } catch (_) {}
        if (requestVersion !== generationVersion) return;
        if (!res.ok) throw new Error(data.detail || "Generate failed (" + res.status + ")");

        lastData = data;

        const answer = (typeof data.answer === "string" && data.answer.trim())
          ? data.answer.trim()
          : (typeof data.response === "string" ? data.response : JSON.stringify(data, null, 2));

        lastMarkdown = "# " + (payload.prompt || "Result").trim().split("\n")[0] + "\n\n" + answer + "\n";

        resultEl.innerHTML = renderMarkdown(answer);

        if (data.started_at && data.finished_at) {
          const sec = (new Date(data.finished_at) - new Date(data.started_at)) / 1000;
          metaEl.textContent = "Took " + sec.toFixed(1) + " s";
        }

        const finalAnswer = typeof data.answer === "string" ? data.answer.trim() : "";
        if (finalAnswer) {
          lastPdf = {prompt: payload.prompt, answer: finalAnswer, meta: metaEl.textContent,
            generatedAt: new Date().toLocaleString("ja-JP")};
          $("pdfBtn").disabled = false;
        }
        applyThinkingVisibility();
        dlJsonBtn.disabled = false;
        dlMdBtn.disabled = false;
        genMsgEl.className = "ok";
        genMsgEl.textContent = "Done.";
      } catch (e) {
        if (requestVersion !== generationVersion) return;
        genMsgEl.className = "err";
        genMsgEl.textContent = e.message;
      } finally {
        if (requestVersion === generationVersion) $("genBtn").disabled = false;
      }
    }


    function openPdfReport() {
      if (!lastPdf || $("pdfBtn").disabled) return;
      const report = window.open("", "_blank");
      if (!report) {
        genMsgEl.className = "err";
        genMsgEl.textContent = "結果画面を開けませんでした。ポップアップを許可してください。";
        return;
      }
      const d = report.document;
      d.documentElement.lang = "ja";
      d.title = "LLM-JP Result";
      const style = d.createElement("style");
      style.textContent = "body{font-family:system-ui,sans-serif;max-width:900px;margin:24px auto;padding:0 20px;line-height:1.7;color:#19362f;overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f2f4f3;padding:14px}code{font-family:monospace}h1,h2,h3,h4{break-after:avoid}button{padding:12px;cursor:pointer}@media print{button,.help{display:none}body{margin:0;max-width:none;padding:0}}@page{size:A4;margin:18mm}";
      d.head.append(style);
      const add = (tag, text) => {const el=d.createElement(tag);el.textContent=text;d.body.append(el);return el;};
      add("h1", "LLM-JP 生成結果");
      add("p", "生成日時：" + lastPdf.generatedAt + (lastPdf.meta ? " / " + lastPdf.meta : ""));
      const help=add("p", "印刷画面で保存先を「PDFに保存」にしてください。");help.className="help";
      const print=add("button", "印刷 / PDF保存");print.type="button";print.addEventListener("click",()=>report.print());
      add("h2", "入力プロンプト");
      add("pre", lastPdf.prompt);
      add("h2", "最終回答");
      const answer=d.createElement("section");
      answer.innerHTML=renderMarkdown(lastPdf.answer);
      d.body.append(answer);
      report.focus();
    }

    $("pdfBtn").addEventListener("click", openPdfReport);
    $("loginBtn").addEventListener("click", login);
    $("logoutBtn").addEventListener("click", logout);
    $("genBtn").addEventListener("click", generate);

    showThinkingEl.addEventListener("change", () => {
      localStorage.setItem("show_thinking", showThinkingEl.checked ? "1" : "0");
      applyThinkingVisibility();
    });

    dlJsonBtn.addEventListener("click", () => {
      if (lastData) {
        download("result-" + stamp() + ".json", JSON.stringify(lastData, null, 2), "application/json");
      }
    });

    dlMdBtn.addEventListener("click", () => {
      if (lastMarkdown) {
        download("result-" + stamp() + ".md", lastMarkdown, "text/markdown");
      }
    });

    $("copyTokenBtn").addEventListener("click", async () => {
      const t = tokenEl.value || "";
      if (!t) {
        loginMsgEl.className = "err";
        loginMsgEl.textContent = "Token is empty.";
        return;
      }
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(t);
        } else {
          tokenEl.focus();
          tokenEl.select();
          tokenEl.setSelectionRange(0, t.length);
          const ok = document.execCommand("copy");
          if (!ok) throw new Error("copy failed");
          window.getSelection().removeAllRanges();
        }
        loginMsgEl.className = "ok";
        loginMsgEl.textContent = "Token copied.";
      } catch (e) {
        tokenEl.focus(); tokenEl.select();
        loginMsgEl.className = "err";
        loginMsgEl.textContent = "Copy failed. Press Ctrl+C after selecting the token.";
      }
    });
  </script>
</body>
</html>
